  .filter-chip {
    border: 1px solid rgba(239,231,216,0.25); background: transparent; color: var(--off-white);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; white-space: nowrap; transition: all .15s ease;

  .filter-chip.active { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 600; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 100px; }
  .ticket { background: var(--cream); color: var(--ink); border-radius: 4px; position: relative; box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
  .ticket::before, .ticket::after {
    content: ""; position: absolute; left: 0; right: 0; height: 10px;
    background-image: radial-gradient(circle at 12px 0, transparent 6px, var(--green-deep) 6.5px);
    background-size: 24px 20px; background-repeat: repeat-x;
  }
  .ticket::before { top: -1px; transform: rotate(180deg); }
  .ticket::after { bottom: -1px; }
  .tear-divider { border-top: 1px dashed rgba(32,28,20,0.3); margin: 12px 0; }

    background: var(--gold); color: var(--ink); font-weight: 700; font-size: 11px; letter-spacing: .06em;

function toMinutes(hhmm) { if (!hhmm) return null; const [h,m] = hhmm.split(":").map(Number); return h*60+m; }
function fmtTime(hhmm) {
  if (!hhmm) return "";
  const [h,m] = hhmm.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2,"0")}${period}`;
}

// Backward-compatible accessor: deals saved before multi-schedule support
// had flat days/startTime/endTime/drinks/food. Wrap those as a single schedule.
function getSchedules(deal) {
  let schedules;
  if (deal.schedules && deal.schedules.length) schedules = deal.schedules;
  else if (deal.days && deal.startTime && deal.endTime) {
    schedules = [{ days: deal.days, startTime: deal.startTime, endTime: deal.endTime, drinks: deal.drinks || [], food: deal.food || [] }];
  } else {
    schedules = [];
  }
  return [...schedules].sort((a, b) => {
    const aMin = a.days && a.days.length ? Math.min(...a.days) : 99;
    const bMin = b.days && b.days.length ? Math.min(...b.days) : 99;
    return aMin - bMin;
  });
}

function scheduleActive(schedule, now) {
  if (!schedule.days || !schedule.days.length || !schedule.startTime || !schedule.endTime) return false;
  const nowDay = now.getDay(), nowMin = now.getHours()*60 + now.getMinutes();
  const start = toMinutes(schedule.startTime), end = toMinutes(schedule.endTime);
  if (start === null || end === null) return false;
  return schedule.days.some(d => {
    if (end > start) return d === nowDay && nowMin >= start && nowMin < end;
    const isStartDay = d === nowDay && nowMin >= start;
    const isSpillDay = (d+1)%7 === nowDay && nowMin < end;
    return isStartDay || isSpillDay;
  });
}
function isActiveNow(deal, now) {
  return getSchedules(deal).some(s => scheduleActive(s, now));
}
function scheduleNextOccurrence(schedule, now) {
  if (!schedule.days || !schedule.days.length || !schedule.startTime) return Infinity;
  const nowDay = now.getDay(), nowMin = now.getHours()*60+now.getMinutes();
  const start = toMinutes(schedule.startTime);
  let best = Infinity;
  schedule.days.forEach(d => {
    let diff = (d - nowDay + 7) % 7;
    let mins = diff*1440 + (start - nowMin);
    if (mins < 0) mins += 7*1440;
    if (mins < best) best = mins;
  });
  return best;
}
function nextOccurrence(deal, now) {
  const vals = getSchedules(deal).map(s => scheduleNextOccurrence(s, now));
  return vals.length ? Math.min(...vals) : Infinity;
}
function dealMatchesDay(deal, dayIndex) {
  return getSchedules(deal).some(s => s.days && s.days.includes(dayIndex));
}
function linesToList(text) { return (text||"").split("\n").map(l=>l.trim()).filter(Boolean); }
function esc(str) { const d = document.createElement("div"); d.textContent = str ?? ""; return d.innerHTML; }
function normalizeUrl(url) {
  if (!url) return "";
  url = url.trim();
  if (!url) return "";
  if (!/^https?:\/\//i.test(url)) url = "https://" + url;
  return url;
}

function distanceMiles(lat1, lng1, lat2, lng2) {
  const R = 3958.8; // Earth radius in miles
  const toRad = (deg) => deg * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function fmtDistance(mi) {
  if (mi < 0.1) return "very close";
  return `${mi.toFixed(mi < 10 ? 1 : 0)} mi away`;
}
function getUserLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error("Geolocation isn't available in this browser.")); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      (err) => reject(err),
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  });
}
function locationErrorMessage(e) {
  if (e && e.code === 1) return "Location access was denied — enable it in your browser's site settings to use this.";
  if (e && e.code === 2) return "Couldn't determine your location right now. Try again in a moment.";
  if (e && e.code === 3) return "Location request timed out. Try again.";
  return (e && e.message) ? e.message : "Couldn't get your location.";
}
function dealMatchesSearch(deal, q) {
  const haystack = [deal.venue, deal.neighborhood, deal.notes];
  getSchedules(deal).forEach(s => { haystack.push(...(s.drinks||[]), ...(s.food||[])); });
  return haystack.some(h => (h || "").toLowerCase().includes(q));
}

// Best-effort parser for the free-text "hours" field (e.g. "Mon–Thu 3pm–3am · Fri–Sat 12pm–3am").
// Returns null if it can't confidently parse anything, so we never show a wrong open/closed badge.
function parseClockTime(t) {
  const m = t.trim().toLowerCase().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)$/);
  if (!m) return null;
  let h = parseInt(m[1], 10);
  const min = m[2] ? parseInt(m[2], 10) : 0;
  if (m[3] === "am") { if (h === 12) h = 0; } else { if (h !== 12) h += 12; }
  return `${String(h).padStart(2,"0")}:${String(min).padStart(2,"0")}`;
}
function parseDayPart(text) {
  if (!text) return [];
  if (/daily|every ?day/i.test(text)) return [0,1,2,3,4,5,6];
  const abbr = DAYS.map(d => d.toLowerCase());
  const groups = text.split(/&|,/).map(s => s.trim()).filter(Boolean);
  const result = new Set();
  groups.forEach(g => {
    const range = g.match(/([a-z]{3})[a-z]*\s*[–-]\s*([a-z]{3})[a-z]*/i);
    if (range) {
      const startIdx = abbr.indexOf(range[1].toLowerCase());
      const endIdx = abbr.indexOf(range[2].toLowerCase());
      if (startIdx !== -1 && endIdx !== -1) {
        let i = startIdx;
        for (let n = 0; n < 7; n++) {
          result.add(i);
          if (i === endIdx) break;
          i = (i + 1) % 7;
        }
      }
    } else {
      const idx = abbr.indexOf(g.toLowerCase().slice(0, 3));
      if (idx !== -1) result.add(idx);
    }
  });
  return [...result];
}
function parseHoursToBlocks(hoursText) {
  if (!hoursText) return null;
  try {
    const segments = hoursText.split("·").map(s => s.trim()).filter(Boolean);
    const blocks = [];
    for (const seg of segments) {
      if (/closed/i.test(seg) && !/\d/.test(seg)) continue; // "Closed Sun" — nothing to add
      const timeMatch = seg.match(/(\d{1,2}(?::\d{2})?\s*(?:am|pm))\s*[–-]\s*(\d{1,2}(?::\d{2})?\s*(?:am|pm))/i);
      if (!timeMatch) continue;
      const days = parseDayPart(seg.slice(0, timeMatch.index));
      if (!days.length) continue;
      const startTime = parseClockTime(timeMatch[1]);
      const endTime = parseClockTime(timeMatch[2]);
      if (!startTime || !endTime) continue;
      blocks.push({ days, startTime, endTime });
    }
    return blocks.length ? blocks : null;
  } catch (e) {
    return null;
  }
}
function isOpenNow(deal) {
  const blocks = parseHoursToBlocks(deal.hours);
  if (!blocks) return null; // unknown — don't guess
  return blocks.some(b => scheduleActive(b, state.now));
}

async function geocodeAddress(address) {
  if (!address) return null;
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=${encodeURIComponent(address)}`);
    const data = await res.json();
    if (data && data[0]) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
  } catch (e) {
    console.error("Geocoding failed:", e);
  }
  return null;
}

async function seedStarterDeals() {
  const btn = document.getElementById("seed-btn") || document.getElementById("seed-link");
  if (btn) { btn.disabled = true; btn.textContent = "Syncing Savannah starters…"; }
  const existingByName = new Map(
    state.deals.map(d => [(d.venue || "").trim().toLowerCase(), d.id])
  );
  for (const deal of SAVANNAH_STARTER_DEALS) {
    const key = deal.venue.trim().toLowerCase();
    try {
      const coords = await geocodeAddress(deal.address);
      const payload = { ...deal };
      if (coords) { payload.lat = coords.lat; payload.lng = coords.lng; }
      const existingId = existingByName.get(key);
      if (existingId) {
        await db.collection("deals").doc(existingId).update({ ...payload, updatedAt: Date.now() });
      } else {
        await db.collection("deals").add({ ...payload, createdAt: Date.now(), updatedAt: Date.now() });
      }
    } catch (e) {
      console.error("Sync failed for", deal.venue, e);
    }
    await new Promise(r => setTimeout(r, 1100)); // be polite to the free geocoding service
  }
}

function getVisibleDeals() {
  let list = [...state.deals];
  if (state.filter === "live") list = list.filter(d => isActiveNow(d, state.now));
  else if (typeof state.filter === "number") list = list.filter(d => dealMatchesDay(d, state.filter));
  const q = state.search.trim().toLowerCase();
  if (q) list = list.filter(d => dealMatchesSearch(d, q));

  const cmp = (a, b) => {
    if (state.sortMode === "near" && state.myLocation) {
      const da = (typeof a.lat === "number") ? distanceMiles(state.myLocation.lat, state.myLocation.lng, a.lat, a.lng) : Infinity;
      const db = (typeof b.lat === "number") ? distanceMiles(state.myLocation.lat, state.myLocation.lng, b.lat, b.lng) : Infinity;
      return da - db;
    }
    if (state.sortMode === "soon") {
      return nextOccurrence(a, state.now) - nextOccurrence(b, state.now);
    }
    if (state.sortMode === "new") {
      return (b.createdAt || 0) - (a.createdAt || 0);
    }
    return (a.venue || "").localeCompare(b.venue || "", undefined, { sensitivity: "base" });
  };
  list.sort((a, b) => {
    const aFav = state.favorites.has(a.id) ? 0 : 1;
    const bFav = state.favorites.has(b.id) ? 0 : 1;
    if (aFav !== bFav) return aFav - bFav;
    return cmp(a, b);
  });
  return list;
}

            <button class="mono" id="about-link" style="background:transparent;border:none;color:rgba(239,231,216,0.5);font-size:11px;text-decoration:underline;text-underline-offset:3px;padding:0;">about & updates</button>
          </div>
        </div>

        <input type="text" id="search-input" class="field-input" style="background:rgba(255,255,255,0.95);margin-top:12px;" placeholder="Search venues, drinks, food…" value="${esc(state.search)}" />

        <div class="filter-row">
          <button class="filter-chip ${state.view==='list'?'active':''}" data-view="list">List</button>
          <button class="filter-chip ${state.view==='map'?'active':''}" data-view="map">Map</button>

          <button class="filter-chip ${state.filter==='live'?'active':''}" data-filter="live">Pouring now</button>
          <button class="filter-chip ${state.filter==='all'?'active':''}" data-filter="all">All deals</button>

        </div>
        <div class="filter-row">
          <span class="mono" style="font-size:11px;opacity:.5;align-self:center;margin-right:2px;">Sort:</span>
          <button class="filter-chip ${state.sortMode==='alpha'?'active':''}" data-sort="alpha">A–Z</button>
          <button class="filter-chip ${state.sortMode==='soon'?'active':''}" data-sort="soon">Starting soon</button>
          <button class="filter-chip ${state.sortMode==='new'?'active':''}" data-sort="new">Newest</button>
          <button class="filter-chip ${state.sortMode==='near'?'active':''}" data-sort="near">${state.locating ? "Locating…" : "Near me"}</button>
        </div>
      </div>
    </header>
    <main>

      ${state.loading ? `<p style="opacity:.7;text-align:center;margin-top:60px;">Loading the tab…</p>` : (state.view === 'map' ? renderMapView(visibleDeals) : renderDealsOrEmpty(visibleDeals))}

  if (wasSearchFocused) {

    if (input) {

}

function renderMapView(list) {
  const missing = list.filter(d => !(typeof d.lat === 'number' && typeof d.lng === 'number'));
  return `
    <div style="position:relative;">
      <div id="map"></div>
      <button id="locate-btn" title="Find me" style="position:absolute;bottom:14px;right:14px;background:var(--cream);z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,0.35);border-radius:50%;width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;font-size:18px;border:none;">${state.locating ? "⏳" : "📍"}</button>
    </div>
    ${missing.length ? `<p class="mono" style="font-size:12px;opacity:.6;margin-top:10px;">${missing.length} deal${missing.length>1?'s':''} without an address won't show on the map yet — edit them to add one.</p>` : ""}
  `;
}

function summarizeSchedules(deal) {
  return getSchedules(deal).map(s => {
    const days = DAYS.filter((_,i)=>(s.days||[]).includes(i)).join(",");
    return `${days} ${fmtTime(s.startTime)}–${fmtTime(s.endTime)}`;
  }).join(" · ");
}

function initMap(list) {
  const container = document.getElementById("map");
  if (!container || typeof L === "undefined") return;
  if (leafletMapInstance) { leafletMapInstance.remove(); leafletMapInstance = null; }

  leafletMapInstance = L.map("map").setView(mapState.center, mapState.zoom);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(leafletMapInstance);

  leafletMapInstance.on("moveend", () => {
    mapState.center = leafletMapInstance.getCenter();
    mapState.zoom = leafletMapInstance.getZoom();
  });

  const withCoords = (list || state.deals).filter(d => typeof d.lat === "number" && typeof d.lng === "number");
  const markersById = {};
  withCoords.forEach(d => {
    const active = isActiveNow(d, state.now);
    const icon = L.divIcon({
      className: "",
      html: `<div style="background:${active ? "#c9a227" : "#16302b"};border:2px solid #f3e9d2;width:16px;height:16px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.4);"></div>`,
      iconSize: [16,16], iconAnchor: [8,8]
    });
    const marker = L.marker([d.lat, d.lng], { icon }).addTo(leafletMapInstance);
    marker.bindPopup(`
      <div style="font-family:Inter,sans-serif;min-width:190px;">
        <a href="#" onclick="goToListing('${d.id}'); return false;" style="font-family:Fraunces,serif;font-size:15px;font-weight:700;color:#16302b;text-decoration:underline;text-underline-offset:2px;">${esc(d.venue)}</a><br/>
        <span style="font-size:12px;color:#555;">${esc(summarizeSchedules(d))}</span>
        ${active ? '<div style="margin-top:4px;font-size:11px;font-weight:700;color:#a67c00;">POURING NOW</div>' : ""}
      </div>
    `);
    markersById[d.id] = marker;
  });

  if (state.myLocation) {
    const youIcon = L.divIcon({
      className: "",
      html: `<div style="background:#4285F4;border:3px solid white;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 6px rgba(66,133,244,0.28);"></div>`,
      iconSize: [14,14], iconAnchor: [7,7]
    });
    L.marker([state.myLocation.lat, state.myLocation.lng], { icon: youIcon, zIndexOffset: 1000 })
      .addTo(leafletMapInstance)
      .bindPopup(`<div style="font-family:Inter,sans-serif;font-size:12px;">You are here</div>`);
  }

  if (withCoords.length && !mapEverFit && !state.focusDealId && !state.focusUserLocation) {
    leafletMapInstance.fitBounds(withCoords.map(d => [d.lat, d.lng]), { padding: [40,40], maxZoom: 15 });
    mapEverFit = true;
  }

  if (state.focusDealId) {
    const target = withCoords.find(d => d.id === state.focusDealId);
    if (target) {
      leafletMapInstance.setView([target.lat, target.lng], 16);
      markersById[target.id]?.openPopup();
    }
    state.focusDealId = null;
  }

  if (state.focusUserLocation && state.myLocation) {
    leafletMapInstance.setView([state.myLocation.lat, state.myLocation.lng], 15);
    state.focusUserLocation = false;
  }
}

function renderDealsOrEmpty(list) {
  if (list.length === 0) {
    const hasAny = state.deals.length > 0;
    let msg = "No deals on the tab yet. Start it off.";
    if (hasAny && state.filter === "live") msg = "Nothing's pouring right now. Check All deals or a specific day.";
    else if (hasAny) msg = "No deals match this filter.";
    return `
      <div class="empty-state">
        <p class="display" style="font-size:20px;color:var(--gold-bright);margin-bottom:8px;">${hasAny ? "Quiet round." : "Empty tab."}</p>
        <p style="color:rgba(239,231,216,0.7);font-size:14px;margin-bottom:20px;">${msg}</p>
        ${!hasAny ? `
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
            <button class="btn-primary" id="empty-add-btn">+ Add the first deal</button>
            <button class="btn-ghost on-dark" id="seed-btn">Load Savannah starter deals</button>
          </div>` : ""}
      </div>`;
  }
  return `<div style="display:flex;flex-direction:column;gap:20px;">${list.map(dealCardHtml).join("")}</div>`;
}

  const drinks = s.drinks || [], food = s.food || [];

      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        ${DAYS.map((d,i)=> (s.days||[]).includes(i) ? `<span class="day-tag ${i===today?'today':''} ${i===filterDay?'filter-selected':''}">${d}</span>` : "").join("")}
        <span class="mono" style="font-size:12px;align-self:center;margin-left:4px;opacity:.75;">${fmtTime(s.startTime)} – ${fmtTime(s.endTime)}</span>
      </div>
      ${(drinks.length || food.length) ? `
        <div style="display:grid;grid-template-columns:${drinks.length && food.length ? '1fr 1fr' : '1fr'};gap:16px;margin-top:8px;">
          ${drinks.length ? `<div><p class="field-label" style="margin-bottom:6px;">Drinks</p><ul class="mono" style="list-style:none;padding:0;margin:0;font-size:13px;line-height:1.7;">${drinks.map(l=>`<li>— ${esc(l)}</li>`).join("")}</ul></div>` : ""}
          ${food.length ? `<div><p class="field-label" style="margin-bottom:6px;">Food</p><ul class="mono" style="list-style:none;padding:0;margin:0;font-size:13px;line-height:1.7;">${food.map(l=>`<li>— ${esc(l)}</li>`).join("")}</ul></div>` : ""}
        </div>` : ""}
    </div>`;
}

function dealCardHtml(deal) {
  const active = isActiveNow(deal, state.now);
  const today = state.now.getDay();
  const filterDay = typeof state.filter === "number" ? state.filter : -1;
  const schedules = getSchedules(deal);
  const hasLinks = deal.website || deal.instagram || deal.facebook;
  const showDistance = state.sortMode === "near" && state.myLocation && typeof deal.lat === "number";
  const distance = showDistance ? distanceMiles(state.myLocation.lat, state.myLocation.lng, deal.lat, deal.lng) : null;
  const isFav = state.favorites.has(deal.id);
  const openNow = isOpenNow(deal);
  const dirUrl = directionsUrl(deal);
  return `
    <div class="ticket" id="deal-${deal.id}" style="padding:22px 20px 18px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
        <div>
          <div style="display:flex;align-items:center;gap:8px;">
            <h2 class="display" style="font-size:22px;font-weight:700;margin:0;">${esc(deal.venue)}</h2>
            <button class="fav-btn" data-fav="${deal.id}" title="${isFav ? "Remove favorite" : "Mark as favorite"}" aria-label="${isFav ? "Remove favorite" : "Mark as favorite"}">${isFav ? "★" : "☆"}</button>
          </div>
          ${deal.neighborhood ? `<p class="mono" style="font-size:12px;margin:3px 0 0;opacity:.65;">${esc(deal.neighborhood)}</p>` : ""}
          ${distance !== null ? `<p class="mono" style="font-size:11px;margin:3px 0 0;opacity:.7;color:var(--green);font-weight:600;">📍 ${fmtDistance(distance)}</p>` : ""}
          ${deal.hours ? `<p class="mono" style="font-size:11px;margin:4px 0 0;opacity:.6;">Open ${esc(deal.hours)}${openNow === true ? ' <span class="open-badge">OPEN NOW</span>' : openNow === false ? ' <span class="closed-badge">CLOSED NOW</span>' : ""}</p>` : ""}
          ${deal.cashOnly ? `<span class="cash-badge" style="margin-top:6px;">💵 CASH ONLY</span>` : ""}
        </div>
        ${active ? `<span class="pour-badge"><span class="pour-dot"></span>POURING NOW</span>` : ""}
      </div>
      <div class="tear-divider"></div>
      ${schedules.length ? `<p class="field-label" style="margin-bottom:4px;">Happy hour</p>` : ""}
      ${schedules.length ? schedules.map(s => scheduleHtml(s, today, filterDay)).join('<div class="tear-divider" style="opacity:.5;"></div>') : `<p class="mono" style="font-size:12px;opacity:.55;">No happy hour info yet — tap Edit to add it.</p>`}
      ${deal.notes ? `<p style="font-size:13px;font-style:italic;margin-top:12px;opacity:.8;">${esc(deal.notes)}</p>` : ""}
      ${(hasLinks || dirUrl) ? `
        <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;">
          ${dirUrl ? `<a class="link-pill" href="${dirUrl}" target="_blank" rel="noopener">Directions</a>` : ""}
          ${deal.website ? `<a class="link-pill" href="${esc(deal.website)}" target="_blank" rel="noopener">Website</a>` : ""}
          ${deal.instagram ? `<a class="link-pill" href="${esc(deal.instagram)}" target="_blank" rel="noopener">Instagram</a>` : ""}
          ${deal.facebook ? `<a class="link-pill" href="${esc(deal.facebook)}" target="_blank" rel="noopener">Facebook</a>` : ""}
        </div>` : ""}
      <div class="tear-divider"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <p class="mono" style="font-size:11px;opacity:.55;margin:0;">added by ${esc(deal.addedBy || "someone")}</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${typeof deal.lat === "number" ? `<button class="icon-btn" data-viewmap="${deal.id}">View on map</button>` : ""}
          <button class="icon-btn" data-edit="${deal.id}">Edit</button>
          <button class="icon-btn danger" data-delete="${deal.id}">Delete</button>
        </div>
      </div>
    </div>`;
}

function scheduleBlockHtml(s, idx) {

    <input type="hidden" class="sched-days" value="${days.join(",")}" />
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;">
      <div><label class="field-label">Starts</label><input type="time" class="field-input sched-start" value="${s?.startTime||"16:00"}" /></div>

    : `<button class="mono" id="name-btn" style="background:transparent;border:none;color:rgba(239,231,216,0.7);font-size:12px;text-decoration:underline;text-underline-offset:3px;">set your name</button>`;
  el.querySelector("#name-btn").onclick = () => {
    el.innerHTML = `<span style="display:flex;gap:6px;align-items:center;">
      <input class="field-input" id="name-input" style="width:140px;background:rgba(255,255,255,0.9);" value="${esc(state.myName)}" />
      <button class="icon-btn" id="name-save">Save</button></span>`;
    const input = el.querySelector("#name-input");
    input.focus();
    const save = () => { saveName(input.value.trim()); render(); };
    el.querySelector("#name-save").onclick = save;
    input.onkeydown = (e) => { if (e.key === "Enter") save(); if (e.key === "Escape") render(); };
  };
}

function bindEvents() {
  document.querySelectorAll("[data-filter]").forEach(btn => {
    btn.onclick = () => {
      const v = btn.dataset.filter;
      state.filter = (v === "live" || v === "all") ? v : Number(v);
      render();
    };
  });
  document.querySelectorAll("[data-view]").forEach(btn => {
    btn.onclick = () => { state.view = btn.dataset.view; render(); };
  });

  const searchInput = document.getElementById("search-input");
  if (searchInput) searchInput.oninput = (e) => { state.search = e.target.value; render(); };
  document.querySelectorAll("[data-sort]").forEach(btn => {
    btn.onclick = () => setSortMode(btn.dataset.sort);
  });
  const locateBtn = document.getElementById("locate-btn");
  if (locateBtn) locateBtn.onclick = () => locateOnMap();

  const addBtn = document.getElementById("add-btn");
  if (addBtn) addBtn.onclick = () => { state.editingDeal = null; state.showForm = true; render(); };
  const emptyAddBtn = document.getElementById("empty-add-btn");
  if (emptyAddBtn) emptyAddBtn.onclick = () => { state.editingDeal = null; state.showForm = true; render(); };
  const seedBtn = document.getElementById("seed-btn");
  if (seedBtn) seedBtn.onclick = () => seedStarterDeals();
  const seedLink = document.getElementById("seed-link");
  if (seedLink) seedLink.onclick = () => seedStarterDeals();
  const aboutLink = document.getElementById("about-link");
  if (aboutLink) aboutLink.onclick = () => { state.showAbout = true; render(); };

  document.querySelectorAll("[data-edit]").forEach(btn => {
    btn.onclick = () => {
      state.editingDeal = state.deals.find(d => d.id === btn.dataset.edit) || null;
      state.showForm = true; render();
    };
  });
  document.querySelectorAll("[data-delete]").forEach(btn => {
    btn.onclick = () => { state.confirmDeleteId = btn.dataset.delete; render(); };
  });
  document.querySelectorAll("[data-viewmap]").forEach(btn => {
    btn.onclick = () => goToMap(btn.dataset.viewmap);
  });
  document.querySelectorAll("[data-fav]").forEach(btn => {
    btn.onclick = () => toggleFavorite(btn.dataset.fav);
  });

  const formOverlay = document.getElementById("form-overlay");
  if (formOverlay) {
    formOverlay.onclick = (e) => { if (e.target === formOverlay) { state.showForm = false; state.editingDeal = null; render(); } };
    document.getElementById("form-cancel").onclick = () => { state.showForm = false; state.editingDeal = null; render(); };

    const form = document.getElementById("deal-form");

    form.addEventListener("click", (e) => {
      if (e.target.matches("[data-day]")) {
        const block = e.target.closest(".schedule-block");
        const hidden = block.querySelector(".sched-days");
        let days = hidden.value ? hidden.value.split(",").map(Number) : [];
        const i = Number(e.target.dataset.day);
        days = days.includes(i) ? days.filter(x=>x!==i) : [...days, i].sort((a,b)=>a-b);
        hidden.value = days.join(",");
        e.target.classList.toggle("selected");
      }
      if (e.target.classList.contains("remove-schedule")) {
        const blocks = form.querySelectorAll(".schedule-block");
        if (blocks.length > 1) e.target.closest(".schedule-block").remove();
      }
    });

    document.getElementById("add-schedule-btn").onclick = () => {
      scheduleBlockCounter += 1;
      document.getElementById("schedules-container").insertAdjacentHTML("beforeend", scheduleBlockHtml(null, "new" + scheduleBlockCounter));
    };

    form.onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      const venue = f.venue.value.trim();
      const addedBy = f.addedBy.value.trim();
      const errEl = document.getElementById("form-error");

      const scheduleBlocks = form.querySelectorAll(".schedule-block");
      const schedules = [];
      scheduleBlocks.forEach(block => {
        const daysVal = block.querySelector(".sched-days").value;
        const days = daysVal ? daysVal.split(",").map(Number) : [];
        if (!days.length) return;
        schedules.push({
          days,
          startTime: block.querySelector(".sched-start").value,
          endTime: block.querySelector(".sched-end").value,
          drinks: linesToList(block.querySelector(".sched-drinks").value),
          food: linesToList(block.querySelector(".sched-food").value),
        });
      });

      if (!venue || !schedules.length || !addedBy) {
        errEl.textContent = "Venue, at least one day/time block with a day selected, and your name are required.";
        errEl.style.display = "block";
        return;
      }

      const submitBtn = f.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      const address = f.address.value.trim();
      submitBtn.textContent = address ? "Finding it on the map…" : "Saving…";
      let coords = null;
      if (address) coords = await geocodeAddress(address);
      if (addedBy !== state.myName) saveName(addedBy);

      const data = {
        venue, neighborhood: f.neighborhood.value.trim(), address,
        hours: f.hours.value.trim(),
        schedules,
        notes: f.notes.value.trim(), addedBy,
        cashOnly: f.cashOnly.checked,
        website: normalizeUrl(f.website.value),
        instagram: normalizeUrl(f.instagram.value),
        facebook: normalizeUrl(f.facebook.value),
      };
      if (coords) { data.lat = coords.lat; data.lng = coords.lng; }
      submitBtn.textContent = "Saving…";
      if (state.editingDeal) await updateDeal(state.editingDeal.id, data);
      else await addDeal(data);
    };
  }

  const confirmOverlay = document.getElementById("confirm-overlay");
  if (confirmOverlay) {
    confirmOverlay.onclick = (e) => { if (e.target === confirmOverlay) { state.confirmDeleteId = null; render(); } };
    document.getElementById("confirm-cancel").onclick = () => { state.confirmDeleteId = null; render(); };
    document.getElementById("confirm-remove").onclick = () => deleteDeal(state.confirmDeleteId);
  }

  const aboutOverlay = document.getElementById("about-overlay");
  if (aboutOverlay) {
    aboutOverlay.onclick = (e) => { if (e.target === aboutOverlay) { state.showAbout = false; render(); } };
    document.getElementById("about-close").onclick = () => { state.showAbout = false; render(); };
  }
}

render();
</script>
</body>
</html>
