<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Tab — Happy Hour Tracker</title>
<link rel="manifest" href="data:application/json,{%22name%22:%22The%20Tab%22,%22short_name%22:%22The%20Tab%22,%22display%22:%22standalone%22,%22start_url%22:%22.%22,%22background_color%22:%22%230f231f%22,%22theme_color%22:%22%230f231f%22}">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --green-deep: #0f231f;
    --green: #16302b;
    --green-light: #234238;
    --cream: #f3e9d2;
    --gold: #c9a227;
    --gold-bright: #e0bc46;
    --rust: #a64b2a;
    --ink: #201c14;
    --off-white: #efe7d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--green) 0%, var(--green-deep) 60%);
    color: var(--off-white);
    min-height: 100vh;
  }
  .display { font-family: 'Fraunces', serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  button, input, textarea { font-family: 'Inter', sans-serif; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--gold-bright); outline-offset: 2px;
  }
  .header-bar {
    position: sticky; top: 0; z-index: 20;
    background: var(--green-deep);
    border-bottom: 1px solid rgba(201,162,39,0.25);
  }
  .header-inner { max-width: 720px; margin: 0 auto; padding: 16px 16px 12px; }
  .filter-row { display: flex; gap: 8px; margin-top: 14px; overflow-x: auto; padding-bottom: 2px; }
  .filter-chip {
    border: 1px solid rgba(239,231,216,0.25); background: transparent; color: var(--off-white);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; white-space: nowrap; transition: all .15s ease;
  }
  .filter-chip.active { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 600; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 100px; }
  .ticket { background: var(--cream); color: var(--ink); border-radius: 4px; position: relative; box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
  .ticket::before, .ticket::after {
    content: ""; position: absolute; left: 0; right: 0; height: 10px;
    background-image: radial-gradient(circle at 12px 0, transparent 6px, var(--green-deep) 6.5px);
    background-size: 24px 20px; background-repeat: repeat-x;
  }
  .ticket::before { top: -1px; transform: rotate(180deg); }
  .ticket::after { bottom: -1px; }
  .tear-divider { border-top: 1px dashed rgba(32,28,20,0.3); margin: 12px 0; }
  .pour-badge {
    background: var(--gold); color: var(--ink); font-weight: 700; font-size: 11px; letter-spacing: .06em;
    padding: 4px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px;
  }
  .pour-dot { width: 6px; height: 6px; border-radius: 50%; background: #1c6b3a; animation: pulse 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .pour-dot { animation: none; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .day-chip {
    border: 1px solid rgba(32,28,20,0.25); background: transparent; color: var(--ink);
    border-radius: 6px; padding: 6px 0; font-size: 12px; font-weight: 600;
  }
  .day-chip.selected { background: var(--green); border-color: var(--green); color: var(--off-white); }
  .day-tag { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: rgba(35,66,56,0.08); }
  .day-tag.today { background: var(--green); color: var(--off-white); }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,35,31,0.75);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 24px 16px; overflow-y: auto; z-index: 50;
  }
  .field-input {
    width: 100%; border: 1px solid rgba(32,28,20,0.25); background: #fffdf7; color: var(--ink);
    border-radius: 6px; padding: 9px 11px; font-size: 14px; font-family: 'Inter', sans-serif;
  }
  .field-label {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
    color: rgba(32,28,20,0.65); display: block; margin-bottom: 4px;
  }
  .btn-primary { background: var(--gold); color: var(--ink); font-weight: 600; border: none; border-radius: 6px; padding: 10px 18px; }
  .btn-primary:hover { background: var(--gold-bright); }
  .btn-primary:disabled { opacity: .6; cursor: default; }
  .btn-ghost { background: transparent; border: 1px solid rgba(32,28,20,0.25); color: var(--ink); border-radius: 6px; padding: 10px 18px; }
  .icon-btn { background: transparent; border: 1px solid rgba(32,28,20,0.2); color: var(--ink); border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 600; }
  .icon-btn.danger { border-color: rgba(166,75,42,0.4); color: var(--rust); }
  .icon-btn:hover { background: rgba(32,28,20,0.06); }
  .fab {
    position: fixed; bottom: 24px; right: 24px; border-radius: 999px; padding: 14px 22px; font-size: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
  }
  .error-banner { background: rgba(166,75,42,0.2); border: 1px solid rgba(166,75,42,0.4); color: var(--off-white); padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
  .empty-state { text-align: center; margin-top: 60px; padding: 0 20px; }
</style>
</head>
<body>
<div id="app"></div>

<!-- Firebase (compat build, no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* ---------- 1. FILL THIS IN with your Firebase config ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyA9Ug1PCS_ScHhsHHnyVUCzj4lb7s0n5vw",
  authDomain: "savannah-happy-hour.firebaseapp.com",
  projectId: "savannah-happy-hour",
  storageBucket: "savannah-happy-hour.firebasestorage.app",
  messagingSenderId: "863862303732",
  appId: "1:863862303732:web:98e960f03f99bbab0da7a1"
};
/* ----------------------------------------------------------------- */

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

const state = {
  deals: [],
  loading: true,
  error: null,
  saving: false,
  myName: localStorage.getItem("tab-my-name") || "",
  now: new Date(),
  filter: "live",
  showForm: false,
  editingDeal: null,
  confirmDeleteId: null,
};

function toMinutes(hhmm) { if (!hhmm) return null; const [h,m] = hhmm.split(":").map(Number); return h*60+m; }
function fmtTime(hhmm) {
  if (!hhmm) return "";
  const [h,m] = hhmm.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2,"0")}${period}`;
}
function isActiveNow(deal, now) {
  if (!deal.days || !deal.days.length || !deal.startTime || !deal.endTime) return false;
  const nowDay = now.getDay(), nowMin = now.getHours()*60 + now.getMinutes();
  const start = toMinutes(deal.startTime), end = toMinutes(deal.endTime);
  if (start === null || end === null) return false;
  return deal.days.some(d => {
    if (end > start) return d === nowDay && nowMin >= start && nowMin < end;
    const isStartDay = d === nowDay && nowMin >= start;
    const isSpillDay = (d+1)%7 === nowDay && nowMin < end;
    return isStartDay || isSpillDay;
  });
}
function nextOccurrence(deal, now) {
  if (!deal.days || !deal.days.length || !deal.startTime) return Infinity;
  const nowDay = now.getDay(), nowMin = now.getHours()*60+now.getMinutes();
  const start = toMinutes(deal.startTime);
  let best = Infinity;
  deal.days.forEach(d => {
    let diff = (d - nowDay + 7) % 7;
    let mins = diff*1440 + (start - nowMin);
    if (mins < 0) mins += 7*1440;
    if (mins < best) best = mins;
  });
  return best;
}
function linesToList(text) { return (text||"").split("\n").map(l=>l.trim()).filter(Boolean); }
function esc(str) { const d = document.createElement("div"); d.textContent = str ?? ""; return d.innerHTML; }

// ---- Firestore live sync ----
db.collection("deals").onSnapshot(
  (snapshot) => {
    state.deals = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    state.loading = false;
    state.error = null;
    render();
  },
  (err) => {
    console.error(err);
    state.loading = false;
    state.error = "Couldn't connect to the shared tab. Check your Firebase config and Firestore rules.";
    render();
  }
);

async function addDeal(data) {
  state.saving = true; render();
  try {
    await db.collection("deals").add({ ...data, createdAt: Date.now(), updatedAt: Date.now() });
    state.showForm = false; state.editingDeal = null;
  } catch (e) {
    state.error = "That didn't save. Try again.";
  } finally {
    state.saving = false; render();
  }
}
async function updateDeal(id, data) {
  state.saving = true; render();
  try {
    await db.collection("deals").doc(id).update({ ...data, updatedAt: Date.now() });
    state.showForm = false; state.editingDeal = null;
  } catch (e) {
    state.error = "That didn't save. Try again.";
  } finally {
    state.saving = false; render();
  }
}
async function deleteDeal(id) {
  try {
    await db.collection("deals").doc(id).delete();
  } catch (e) {
    state.error = "Couldn't delete that. Try again.";
  } finally {
    state.confirmDeleteId = null; render();
  }
}
function saveName(name) {
  state.myName = name;
  localStorage.setItem("tab-my-name", name);
}

// clock tick — light touch, doesn't disrupt an open form
setInterval(() => {
  state.now = new Date();
  if (!state.showForm && !state.confirmDeleteId) render();
  else {
    const clockEl = document.getElementById("clock-text");
    if (clockEl) clockEl.textContent = clockLabel();
  }
}, 30000);

function clockLabel() {
  const liveCount = state.deals.filter(d => isActiveNow(d, state.now)).length;
  return `${state.now.toLocaleDateString(undefined,{weekday:"long"})} · ${state.now.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}${liveCount>0 ? ` · ${liveCount} pouring now` : ""}`;
}

function getVisibleDeals() {
  let list = [...state.deals];
  if (state.filter === "live") list = list.filter(d => isActiveNow(d, state.now));
  else if (typeof state.filter === "number") list = list.filter(d => d.days && d.days.includes(state.filter));
  list.sort((a,b) => {
    const aActive = isActiveNow(a, state.now), bActive = isActiveNow(b, state.now);
    if (aActive !== bActive) return aActive ? -1 : 1;
    return nextOccurrence(a, state.now) - nextOccurrence(b, state.now);
  });
  return list;
}

function render() {
  const app = document.getElementById("app");
  const visibleDeals = getVisibleDeals();

  app.innerHTML = `
    <header class="header-bar">
      <div class="header-inner">
        <div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;">
          <div>
            <h1 class="display" style="font-size:28px;font-weight:700;margin:0;color:var(--gold-bright);">The Tab</h1>
            <p class="mono" id="clock-text" style="font-size:12px;margin:2px 0 0;color:rgba(239,231,216,0.65);">${clockLabel()}</p>
          </div>
          <div id="name-field"></div>
        </div>
        <div class="filter-row">
          <button class="filter-chip ${state.filter==='live'?'active':''}" data-filter="live">Pouring now</button>
          <button class="filter-chip ${state.filter==='all'?'active':''}" data-filter="all">All deals</button>
          ${DAYS.map((d,i)=>`<button class="filter-chip ${state.filter===i?'active':''}" data-filter="${i}">${d}</button>`).join("")}
        </div>
      </div>
    </header>
    <main>
      ${state.error ? `<div class="error-banner">${esc(state.error)}</div>` : ""}
      ${state.loading ? `<p style="opacity:.7;text-align:center;margin-top:60px;">Loading the tab…</p>` : renderDealsOrEmpty(visibleDeals)}
    </main>
    <button class="btn-primary fab" id="add-btn">+ Add deal</button>
    ${state.showForm ? renderForm() : ""}
    ${state.confirmDeleteId ? renderConfirm() : ""}
  `;

  renderNameField();
  bindEvents();
}

function renderDealsOrEmpty(list) {
  if (list.length === 0) {
    const hasAny = state.deals.length > 0;
    let msg = "No deals on the tab yet. Start it off.";
    if (hasAny && state.filter === "live") msg = "Nothing's pouring right now. Check All deals or a specific day.";
    else if (hasAny) msg = "No deals match this filter.";
    return `
      <div class="empty-state">
        <p class="display" style="font-size:20px;color:var(--gold-bright);margin-bottom:8px;">${hasAny ? "Quiet round." : "Empty tab."}</p>
        <p style="color:rgba(239,231,216,0.7);font-size:14px;margin-bottom:20px;">${msg}</p>
        ${!hasAny ? `<button class="btn-primary" id="empty-add-btn">+ Add the first deal</button>` : ""}
      </div>`;
  }
  return `<div style="display:flex;flex-direction:column;gap:20px;">${list.map(dealCardHtml).join("")}</div>`;
}

function dealCardHtml(deal) {
  const active = isActiveNow(deal, state.now);
  const today = state.now.getDay();
  const drinks = deal.drinks || [], food = deal.food || [];
  return `
    <div class="ticket" style="padding:22px 20px 18px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
        <div>
          <h2 class="display" style="font-size:22px;font-weight:700;margin:0;">${esc(deal.venue)}</h2>
          ${deal.neighborhood ? `<p class="mono" style="font-size:12px;margin:3px 0 0;opacity:.65;">${esc(deal.neighborhood)}</p>` : ""}
        </div>
        ${active ? `<span class="pour-badge"><span class="pour-dot"></span>POURING NOW</span>` : ""}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;">
        ${DAYS.map((d,i)=> (deal.days||[]).includes(i) ? `<span class="day-tag ${i===today?'today':''}">${d}</span>` : "").join("")}
        <span class="mono" style="font-size:12px;align-self:center;margin-left:4px;opacity:.75;">${fmtTime(deal.startTime)} – ${fmtTime(deal.endTime)}</span>
      </div>
      ${(drinks.length || food.length) ? `
        <div class="tear-divider"></div>
        <div style="display:grid;grid-template-columns:${drinks.length && food.length ? '1fr 1fr' : '1fr'};gap:16px;">
          ${drinks.length ? `<div><p class="field-label" style="margin-bottom:6px;">Drinks</p><ul class="mono" style="list-style:none;padding:0;margin:0;font-size:13px;line-height:1.7;">${drinks.map(l=>`<li>— ${esc(l)}</li>`).join("")}</ul></div>` : ""}
          ${food.length ? `<div><p class="field-label" style="margin-bottom:6px;">Food</p><ul class="mono" style="list-style:none;padding:0;margin:0;font-size:13px;line-height:1.7;">${food.map(l=>`<li>— ${esc(l)}</li>`).join("")}</ul></div>` : ""}
        </div>` : ""}
      ${deal.notes ? `<p style="font-size:13px;font-style:italic;margin-top:12px;opacity:.8;">${esc(deal.notes)}</p>` : ""}
      <div class="tear-divider"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <p class="mono" style="font-size:11px;opacity:.55;margin:0;">added by ${esc(deal.addedBy || "someone")}</p>
        <div style="display:flex;gap:8px;">
          <button class="icon-btn" data-edit="${deal.id}">Edit</button>
          <button class="icon-btn danger" data-delete="${deal.id}">Delete</button>
        </div>
      </div>
    </div>`;
}

function renderForm() {
  const d = state.editingDeal;
  const days = d?.days || [];
  return `
    <div class="modal-overlay" id="form-overlay">
      <form class="ticket" id="deal-form" style="max-width:520px;width:100%;padding:26px 24px 20px;margin-top:10px;">
        <h2 class="display" style="font-size:22px;font-weight:700;margin:0 0 16px;">${d ? "Edit deal" : "New deal"}</h2>
        <div style="display:grid;gap:14px;">
          <div>
            <label class="field-label">Venue name</label>
            <input class="field-input" name="venue" value="${esc(d?.venue||"")}" placeholder="e.g. The Anchor Room" />
          </div>
          <div>
            <label class="field-label">Neighborhood / area (optional)</label>
            <input class="field-input" name="neighborhood" value="${esc(d?.neighborhood||"")}" placeholder="e.g. Downtown" />
          </div>
          <div>
            <label class="field-label">Days</label>
            <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;">
              ${DAYS.map((day,i)=>`<button type="button" class="day-chip ${days.includes(i)?'selected':''}" data-day="${i}">${day}</button>`).join("")}
            </div>
            <input type="hidden" name="days" value="${days.join(",")}" />
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div><label class="field-label">Starts</label><input type="time" class="field-input" name="startTime" value="${d?.startTime||"16:00"}" /></div>
            <div><label class="field-label">Ends</label><input type="time" class="field-input" name="endTime" value="${d?.endTime||"18:00"}" /></div>
          </div>
          <div>
            <label class="field-label">Drink deals — one per line</label>
            <textarea class="field-input" name="drinks" rows="3" placeholder="$5 draft beers&#10;2-for-1 well cocktails&#10;$6 house wine">${esc((d?.drinks||[]).join("\n"))}</textarea>
          </div>
          <div>
            <label class="field-label">Food deals — one per line</label>
            <textarea class="field-input" name="food" rows="3" placeholder="Half-price apps&#10;$1 oysters&#10;$8 flatbreads">${esc((d?.food||[]).join("\n"))}</textarea>
          </div>
          <div>
            <label class="field-label">Notes (optional)</label>
            <input class="field-input" name="notes" value="${esc(d?.notes||"")}" placeholder="e.g. Patio only, cash tips appreciated" />
          </div>
          <div>
            <label class="field-label">Your name</label>
            <input class="field-input" name="addedBy" value="${esc(d?.addedBy || state.myName || "")}" placeholder="So the crew knows who added this" />
          </div>
        </div>
        <p id="form-error" style="color:var(--rust);font-size:12px;margin-top:10px;display:none;"></p>
        <div class="tear-divider"></div>
        <div style="display:flex;justify-content:flex-end;gap:10px;">
          <button type="button" class="btn-ghost" id="form-cancel">Cancel</button>
          <button type="submit" class="btn-primary" ${state.saving?"disabled":""}>${state.saving ? "Saving…" : (d ? "Save changes" : "Add to tab")}</button>
        </div>
      </form>
    </div>`;
}

function renderConfirm() {
  const deal = state.deals.find(d => d.id === state.confirmDeleteId);
  return `
    <div class="modal-overlay" id="confirm-overlay">
      <div class="ticket" style="max-width:380px;width:100%;padding:24px 22px;margin-top:80px;">
        <h3 class="display" style="font-size:19px;font-weight:700;margin:0 0 8px;">Remove this deal?</h3>
        <p style="font-size:14px;opacity:.8;margin:0 0 18px;">${deal ? `"${esc(deal.venue)}" will be removed from everyone's tab. This can't be undone.` : "This will be removed from everyone's tab. This can't be undone."}</p>
        <div style="display:flex;justify-content:flex-end;gap:10px;">
          <button class="btn-ghost" id="confirm-cancel">Cancel</button>
          <button class="btn-primary" style="background:var(--rust);color:var(--off-white);" id="confirm-remove">Remove</button>
        </div>
      </div>
    </div>`;
}

function renderNameField() {
  const el = document.getElementById("name-field");
  if (!el) return;
  el.innerHTML = state.myName
    ? `<button class="mono" id="name-btn" style="background:transparent;border:none;color:rgba(239,231,216,0.7);font-size:12px;text-decoration:underline;text-underline-offset:3px;">ordering as ${esc(state.myName)}</button>`
    : `<button class="mono" id="name-btn" style="background:transparent;border:none;color:rgba(239,231,216,0.7);font-size:12px;text-decoration:underline;text-underline-offset:3px;">set your name</button>`;
  el.querySelector("#name-btn").onclick = () => {
    el.innerHTML = `<span style="display:flex;gap:6px;align-items:center;">
      <input class="field-input" id="name-input" style="width:140px;background:rgba(255,255,255,0.9);" value="${esc(state.myName)}" />
      <button class="icon-btn" id="name-save">Save</button></span>`;
    const input = el.querySelector("#name-input");
    input.focus();
    const save = () => { saveName(input.value.trim()); render(); };
    el.querySelector("#name-save").onclick = save;
    input.onkeydown = (e) => { if (e.key === "Enter") save(); if (e.key === "Escape") render(); };
  };
}

function bindEvents() {
  document.querySelectorAll("[data-filter]").forEach(btn => {
    btn.onclick = () => {
      const v = btn.dataset.filter;
      state.filter = (v === "live" || v === "all") ? v : Number(v);
      render();
    };
  });

  const addBtn = document.getElementById("add-btn");
  if (addBtn) addBtn.onclick = () => { state.editingDeal = null; state.showForm = true; render(); };
  const emptyAddBtn = document.getElementById("empty-add-btn");
  if (emptyAddBtn) emptyAddBtn.onclick = () => { state.editingDeal = null; state.showForm = true; render(); };

  document.querySelectorAll("[data-edit]").forEach(btn => {
    btn.onclick = () => {
      state.editingDeal = state.deals.find(d => d.id === btn.dataset.edit) || null;
      state.showForm = true; render();
    };
  });
  document.querySelectorAll("[data-delete]").forEach(btn => {
    btn.onclick = () => { state.confirmDeleteId = btn.dataset.delete; render(); };
  });

  const formOverlay = document.getElementById("form-overlay");
  if (formOverlay) {
    formOverlay.onclick = (e) => { if (e.target === formOverlay) { state.showForm = false; state.editingDeal = null; render(); } };
    document.getElementById("form-cancel").onclick = () => { state.showForm = false; state.editingDeal = null; render(); };
    document.querySelectorAll("[data-day]").forEach(btn => {
      btn.onclick = () => {
        const hidden = document.querySelector('input[name="days"]');
        let days = hidden.value ? hidden.value.split(",").map(Number) : [];
        const i = Number(btn.dataset.day);
        days = days.includes(i) ? days.filter(x=>x!==i) : [...days, i].sort((a,b)=>a-b);
        hidden.value = days.join(",");
        btn.classList.toggle("selected");
      };
    });
    document.getElementById("deal-form").onsubmit = (e) => {
      e.preventDefault();
      const f = e.target;
      const venue = f.venue.value.trim();
      const days = f.days.value ? f.days.value.split(",").map(Number) : [];
      const addedBy = f.addedBy.value.trim();
      const errEl = document.getElementById("form-error");
      if (!venue || !days.length || !addedBy) {
        errEl.textContent = "Venue, at least one day, and your name are required.";
        errEl.style.display = "block";
        return;
      }
      if (addedBy !== state.myName) saveName(addedBy);
      const data = {
        venue, neighborhood: f.neighborhood.value.trim(), days,
        startTime: f.startTime.value, endTime: f.endTime.value,
        drinks: linesToList(f.drinks.value), food: linesToList(f.food.value),
        notes: f.notes.value.trim(), addedBy,
      };
      if (state.editingDeal) updateDeal(state.editingDeal.id, data);
      else addDeal(data);
    };
  }

  const confirmOverlay = document.getElementById("confirm-overlay");
  if (confirmOverlay) {
    confirmOverlay.onclick = (e) => { if (e.target === confirmOverlay) { state.confirmDeleteId = null; render(); } };
    document.getElementById("confirm-cancel").onclick = () => { state.confirmDeleteId = null; render(); };
    document.getElementById("confirm-remove").onclick = () => deleteDeal(state.confirmDeleteId);
  }
}

render();
</script>
</body>
</html>
