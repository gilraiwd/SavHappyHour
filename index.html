  :root {

    --green-light: #234238;
    --cream: #f3e9d2;
    --gold: #c9a227;
    --gold-bright: #e0bc46;
    --rust: #a64b2a;
    --ink: #201c14;
    --off-white: #efe7d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--green) 0%, var(--green-deep) 60%);
    color: var(--off-white);
    min-height: 100vh;
  }
  .display { font-family: 'Fraunces', serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  button, input, textarea { font-family: 'Inter', sans-serif; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--gold-bright); outline-offset: 2px;
  }
  .header-bar {
    position: sticky; top: 0; z-index: 20;
    background: var(--green-deep);
    border-bottom: 1px solid rgba(201,162,39,0.25);
  }
  .header-inner { max-width: 720px; margin: 0 auto; padding: 16px 16px 12px; }
  .filter-row { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; }
  .filter-chip {
    border: 1px solid rgba(239,231,216,0.25); background: transparent; color: var(--off-white);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; white-space: nowrap; transition: all .15s ease;
  }
  .filter-chip.active { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 600; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 100px; }
  .ticket { background: var(--cream); color: var(--ink); border-radius: 4px; position: relative; box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
  .ticket::before, .ticket::after {
    content: ""; position: absolute; left: 0; right: 0; height: 10px;
    background-image: radial-gradient(circle at 12px 0, transparent 6px, var(--green-deep) 6.5px);
    background-size: 24px 20px; background-repeat: repeat-x;
  }
  .ticket::before { top: -1px; transform: rotate(180deg); }
  .ticket::after { bottom: -1px; }
  .tear-divider { border-top: 1px dashed rgba(32,28,20,0.3); margin: 12px 0; }
  .pour-badge {
    background: var(--gold); color: var(--ink); font-weight: 700; font-size: 11px; letter-spacing: .06em;
    padding: 4px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px;
  }
  .cash-badge {
    background: transparent; color: var(--ink); font-weight: 700; font-size: 11px; letter-spacing: .04em;
    padding: 3px 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid rgba(32,28,20,0.35);
  }
  .fav-btn {
    background: transparent; border: none; font-size: 20px; line-height: 1; cursor: pointer;
    color: var(--gold); padding: 0 2px;
  }
  .open-badge, .closed-badge {
    font-weight: 700; letter-spacing: .03em; padding: 1px 6px; border-radius: 4px; font-size: 10px;
  }
  .open-badge { background: rgba(28,107,58,0.15); color: #1c6b3a; }
  .closed-badge { background: rgba(166,75,42,0.15); color: var(--rust); }
  .pour-dot { width: 6px; height: 6px; border-radius: 50%; background: #1c6b3a; animation: pulse 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .pour-dot { animation: none; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .day-chip {
    border: 1px solid rgba(32,28,20,0.25); background: transparent; color: var(--ink);
    border-radius: 6px; padding: 6px 0; font-size: 12px; font-weight: 600;
  }
  .day-chip.selected { background: var(--green); border-color: var(--green); color: var(--off-white); }
  .day-tag { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: rgba(35,66,56,0.08); }
  .day-tag.today { background: var(--green); color: var(--off-white); }
  .day-tag.filter-selected { box-shadow: 0 0 0 2px var(--gold); }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,35,31,0.75);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 24px 16px; overflow-y: auto; z-index: 2000;
  }
  .field-input {
    width: 100%; border: 1px solid rgba(32,28,20,0.25); background: #fffdf7; color: var(--ink);

  }
  .field-label {

  .field-hint { font-size: 11px; color: rgba(32,28,20,0.5); margin: 4px 0 0; }
  .btn-primary { background: var(--gold); color: var(--ink); font-weight: 600; border: none; border-radius: 6px; padding: 10px 18px; }

function toMinutes(hhmm) { if (!hhmm) return null; const [h,m] = hhmm.split(":").map(Number); return h*60+m; }
function fmtTime(hhmm) {
  if (!hhmm) return "";
  const [h,m] = hhmm.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2,"0")}${period}`;
}

// Backward-compatible accessor: deals saved before multi-schedule support
// had flat days/startTime/endTime/drinks/food. Wrap those as a single schedule.
function getSchedules(deal) {
  let schedules;
  if (deal.schedules && deal.schedules.length) schedules = deal.schedules;
  else if (deal.days && deal.startTime && deal.endTime) {
    schedules = [{ days: deal.days, startTime: deal.startTime, endTime: deal.endTime, drinks: deal.drinks || [], food: deal.food || [] }];
  } else {
    schedules = [];
  }
  return [...schedules].sort((a, b) => {
    const aMin = a.days && a.days.length ? Math.min(...a.days) : 99;
    const bMin = b.days && b.days.length ? Math.min(...b.days) : 99;
    return aMin - bMin;
  });
}

function scheduleActive(schedule, now) {
  if (!schedule.days || !schedule.days.length || !schedule.startTime || !schedule.endTime) return false;
  const nowDay = now.getDay(), nowMin = now.getHours()*60 + now.getMinutes();
  const start = toMinutes(schedule.startTime), end = toMinutes(schedule.endTime);
  if (start === null || end === null) return false;
  return schedule.days.some(d => {
    if (end > start) return d === nowDay && nowMin >= start && nowMin < end;
    const isStartDay = d === nowDay && nowMin >= start;
    const isSpillDay = (d+1)%7 === nowDay && nowMin < end;
    return isStartDay || isSpillDay;
  });
}
function isActiveNow(deal, now) {
  return getSchedules(deal).some(s => scheduleActive(s, now));
}
function scheduleNextOccurrence(schedule, now) {
  if (!schedule.days || !schedule.days.length || !schedule.startTime) return Infinity;
  const nowDay = now.getDay(), nowMin = now.getHours()*60+now.getMinutes();
  const start = toMinutes(schedule.startTime);
  let best = Infinity;
  schedule.days.forEach(d => {
    let diff = (d - nowDay + 7) % 7;
    let mins = diff*1440 + (start - nowMin);
    if (mins < 0) mins += 7*1440;
    if (mins < best) best = mins;
  });
  return best;
}
function nextOccurrence(deal, now) {
  const vals = getSchedules(deal).map(s => scheduleNextOccurrence(s, now));
  return vals.length ? Math.min(...vals) : Infinity;
}
function dealMatchesDay(deal, dayIndex) {
  return getSchedules(deal).some(s => s.days && s.days.includes(dayIndex));
}
function linesToList(text) { return (text||"").split("\n").map(l=>l.trim()).filter(Boolean); }
function esc(str) { const d = document.createElement("div"); d.textContent = str ?? ""; return d.innerHTML; }
function normalizeUrl(url) {
  if (!url) return "";
  url = url.trim();
  if (!url) return "";
  if (!/^https?:\/\//i.test(url)) url = "https://" + url;
  return url;
}

function distanceMiles(lat1, lng1, lat2, lng2) {
  const R = 3958.8; // Earth radius in miles
  const toRad = (deg) => deg * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function fmtDistance(mi) {
  if (mi < 0.1) return "very close";
  return `${mi.toFixed(mi < 10 ? 1 : 0)} mi away`;
}
function getUserLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error("Geolocation isn't available in this browser.")); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      (err) => reject(err),
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  });
}
function locationErrorMessage(e) {
  if (e && e.code === 1) return "Location access was denied — enable it in your browser's site settings to use this.";
  if (e && e.code === 2) return "Couldn't determine your location right now. Try again in a moment.";
  if (e && e.code === 3) return "Location request timed out. Try again.";
  return (e && e.message) ? e.message : "Couldn't get your location.";
}
function dealMatchesSearch(deal, q) {
  const haystack = [deal.venue, deal.neighborhood, deal.notes];
  getSchedules(deal).forEach(s => { haystack.push(...(s.drinks||[]), ...(s.food||[])); });
  return haystack.some(h => (h || "").toLowerCase().includes(q));
}

// Best-effort parser for the free-text "hours" field (e.g. "Mon–Thu 3pm–3am · Fri–Sat 12pm–3am").
// Returns null if it can't confidently parse anything, so we never show a wrong open/closed badge.
function parseClockTime(t) {
  const m = t.trim().toLowerCase().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)$/);
  if (!m) return null;
  let h = parseInt(m[1], 10);
  const min = m[2] ? parseInt(m[2], 10) : 0;
  if (m[3] === "am") { if (h === 12) h = 0; } else { if (h !== 12) h += 12; }
  return `${String(h).padStart(2,"0")}:${String(min).padStart(2,"0")}`;
}
function parseDayPart(text) {
  if (!text) return [];
  if (/daily|every ?day/i.test(text)) return [0,1,2,3,4,5,6];
  const abbr = DAYS.map(d => d.toLowerCase());
  const groups = text.split(/&|,/).map(s => s.trim()).filter(Boolean);
  const result = new Set();
  groups.forEach(g => {
    const range = g.match(/([a-z]{3})[a-z]*\s*[–-]\s*([a-z]{3})[a-z]*/i);
    if (range) {
      const startIdx = abbr.indexOf(range[1].toLowerCase());
      const endIdx = abbr.indexOf(range[2].toLowerCase());
      if (startIdx !== -1 && endIdx !== -1) {
        let i = startIdx;
        for (let n = 0; n < 7; n++) {
          result.add(i);
          if (i === endIdx) break;
          i = (i + 1) % 7;
        }
      }
    } else {
      const idx = abbr.indexOf(g.toLowerCase().slice(0, 3));
      if (idx !== -1) result.add(idx);
    }
  });
  return [...result];
}
function parseHoursToBlocks(hoursText) {
  if (!hoursText) return null;
  try {
    const segments = hoursText.split("·").map(s => s.trim()).filter(Boolean);
    const blocks = [];
    for (const seg of segments) {
      if (/closed/i.test(seg) && !/\d/.test(seg)) continue; // "Closed Sun" — nothing to add
      const timeMatch = seg.match(/(\d{1,2}(?::\d{2})?\s*(?:am|pm))\s*[–-]\s*(\d{1,2}(?::\d{2})?\s*(?:am|pm))/i);
      if (!timeMatch) continue;
      const days = parseDayPart(seg.slice(0, timeMatch.index));
      if (!days.length) continue;
      const startTime = parseClockTime(timeMatch[1]);
      const endTime = parseClockTime(timeMatch[2]);
      if (!startTime || !endTime) continue;
      blocks.push({ days, startTime, endTime });
    }
    return blocks.length ? blocks : null;
  } catch (e) {
    return null;
  }
}
// Structured operating-hours accessor. Falls back to parsing the old free-text
// "hours" field for any venue that predates the day-block editor.
function getHoursBlocks(deal) {
  if (deal.hoursBlocks && deal.hoursBlocks.length) return deal.hoursBlocks;
  if (deal.hours) {
    const parsed = parseHoursToBlocks(deal.hours);
    if (parsed) return parsed;
  }
  return [];
}
// Collapses a set of day indices into contiguous ranges, e.g. [1,2,3,4,5] -> [{start:1,end:5}]
function dayRanges(days) {
  if (!days || !days.length) return [];
  const sorted = [...new Set(days)].sort((a, b) => a - b);
  const ranges = [];
  let start = sorted[0], prev = sorted[0];
  for (let i = 1; i <= sorted.length; i++) {
    const cur = sorted[i];
    if (cur === prev + 1) { prev = cur; continue; }
    ranges.push({ start, end: prev });
    start = cur; prev = cur;
  }
  return ranges;
}
function formatDayRange(days) {
  const ranges = dayRanges(days);
  if (!ranges.length) return "";
  if (ranges.length === 1 && ranges[0].start === 0 && ranges[0].end === 6) return "Daily";
  return ranges.map(r => r.start === r.end ? DAYS[r.start] : `${DAYS[r.start]}–${DAYS[r.end]}`).join(", ");
}

function summarizeHours(deal) {
  const blocks = getHoursBlocks(deal);
  if (!blocks.length) return "";
  return blocks.map(b => `${formatDayRange(b.days)} ${fmtTime(b.startTime)}–${fmtTime(b.endTime)}`).join(" · ");
}
function isOpenNow(deal) {
  const blocks = getHoursBlocks(deal);
  if (!blocks.length) return null; // unknown — don't guess
  return blocks.some(b => scheduleActive(b, state.now));
}

function directionsUrl(deal) {
  if (typeof deal.lat === "number" && typeof deal.lng === "number") {
    return `https://www.google.com/maps/dir/?api=1&destination=${deal.lat},${deal.lng}`;
  }
  if (deal.address) {

  }

}

// City filtering: uses an explicit city field if set, otherwise derives "City, ST" from
// the street address so older entries (and future ones without a manually-set city) still work.
function getCity(deal) {
  if (deal.city) return deal.city;
  if (deal.address) {
    const m = deal.address.match(/,\s*([A-Za-z .'-]+),\s*([A-Z]{2})\b/);
    if (m) return `${m[1].trim()}, ${m[2].trim()}`;
  }
  return "";
}

function fmtRelativeTime(ts) {
  if (!ts) return null;
  const diffDays = Math.floor((Date.now() - ts) / 86400000);
  if (diffDays <= 0) return "today";
  if (diffDays === 1) return "1 day ago";
  if (diffDays < 7) return `${diffDays} days ago`;
  const weeks = Math.floor(diffDays / 7);
  if (weeks === 1) return "1 week ago";
  if (weeks < 5) return `${weeks} weeks ago`;
  const months = Math.floor(diffDays / 30);
  if (months <= 1) return "1 month ago";
  if (months < 12) return `${months} months ago`;
  const years = Math.floor(diffDays / 365);
  return years === 1 ? "1 year ago" : `${years} years ago`;
}

function buildShareText(deal) {
  const lines = [deal.venue];
  if (deal.neighborhood) lines.push(deal.neighborhood);
  getSchedules(deal).forEach(s => {
    const days = DAYS.filter((_, i) => (s.days || []).includes(i)).join(", ");
    lines.push(`${days} ${fmtTime(s.startTime)}–${fmtTime(s.endTime)}`);
    (s.drinks || []).forEach(d => lines.push(`- ${d}`));
    (s.food || []).forEach(f => lines.push(`- ${f}`));
  });
  if (deal.notes) lines.push(deal.notes);
  if (deal.address) lines.push(deal.address);
  return lines.join("\n");
}
async function shareDeal(id) {
  const deal = state.deals.find(d => d.id === id);
  if (!deal) return;
  const text = buildShareText(deal);
  const btn = document.querySelector(`[data-share="${id}"]`);
  try {
    if (navigator.share) {
      await navigator.share({ text, title: deal.venue });
      return;
    }
    await navigator.clipboard.writeText(text);
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = "Copied!";
      setTimeout(() => { btn.textContent = orig; }, 1500);
    }
  } catch (e) {
    if (e && e.name === "AbortError") return; // user closed the share sheet
    state.error = "Couldn't share that — try copying it manually.";
    render();
  }
}

async function geocodeAddress(address) {
  if (!address) return null;
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=${encodeURIComponent(address)}`);
    const data = await res.json();
    if (data && data[0]) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
  } catch (e) {
    console.error("Geocoding failed:", e);
  }
  return null;
}
async function retryGeocode(id) {
  const deal = state.deals.find(d => d.id === id);
  if (!deal || !deal.address) return;
  const btn = document.querySelector(`[data-retrygeo="${id}"]`);
  if (btn) { btn.disabled = true; btn.textContent = "Locating…"; }
  const coords = await geocodeAddress(deal.address);
  if (coords) {
    try {
      await db.collection("deals").doc(id).update({ lat: coords.lat, lng: coords.lng, updatedAt: Date.now() });
      state.error = null;
    } catch (e) {
      state.error = "Found the location but couldn't save it — try again.";
    }
  } else {
    state.error = `Couldn't find "${deal.address}" on a map. Try editing it to be more specific (street, city, and state), or use "Set pin manually" instead.`;
  }
  render();
}

}

function getVisibleDeals() {
  let list = [...state.deals];
  if (state.cityFilter !== "all") list = list.filter(d => getCity(d) === state.cityFilter);
  if (state.filter === "live") list = list.filter(d => isActiveNow(d, state.now));
  else if (state.filter === "open") list = list.filter(d => isOpenNow(d) === true);
  else if (typeof state.filter === "number") list = list.filter(d => dealMatchesDay(d, state.filter));
  const q = state.search.trim().toLowerCase();
  if (q) list = list.filter(d => dealMatchesSearch(d, q));

  const cmp = (a, b) => {
    if (state.sortMode === "near" && state.myLocation) {
      const da = (typeof a.lat === "number") ? distanceMiles(state.myLocation.lat, state.myLocation.lng, a.lat, a.lng) : Infinity;
      const db = (typeof b.lat === "number") ? distanceMiles(state.myLocation.lat, state.myLocation.lng, b.lat, b.lng) : Infinity;
      return da - db;
    }
    if (state.sortMode === "soon") {
      return nextOccurrence(a, state.now) - nextOccurrence(b, state.now);
    }
    if (state.sortMode === "new") {
      return (b.createdAt || 0) - (a.createdAt || 0);
    }
    return (a.venue || "").localeCompare(b.venue || "", undefined, { sensitivity: "base" });
  };
  list.sort((a, b) => {
    const aFav = state.favorites.has(a.id) ? 0 : 1;
    const bFav = state.favorites.has(b.id) ? 0 : 1;
    if (aFav !== bFav) return aFav - bFav;
    return cmp(a, b);
  });
  return list;
}

    });
  }

  const withCoords = (list || state.deals).filter(d => typeof d.lat === "number" && typeof d.lng === "number");
  const markersById = {};
  withCoords.forEach(d => {
    const active = isActiveNow(d, state.now);
    const icon = L.divIcon({
      className: "",
      html: `<div style="background:${active ? "#c9a227" : "#16302b"};border:2px solid #f3e9d2;width:16px;height:16px;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.4);"></div>`,
      iconSize: [16,16], iconAnchor: [8,8]
    });
    const marker = L.marker([d.lat, d.lng], { icon }).addTo(leafletMapInstance);
    marker.bindPopup(`
      <div style="font-family:Inter,sans-serif;min-width:190px;">
        <a href="#" onclick="goToListing('${d.id}'); return false;" style="font-family:Fraunces,serif;font-size:15px;font-weight:700;color:#16302b;text-decoration:underline;text-underline-offset:2px;">${esc(d.venue)}</a><br/>
        <span style="font-size:12px;color:#555;">${esc(summarizeSchedules(d))}</span>
        ${active ? '<div style="margin-top:4px;font-size:11px;font-weight:700;color:#a67c00;">POURING NOW</div>' : ""}
      </div>
    `);
    markersById[d.id] = marker;
  });

  if (state.myLocation) {
    const youIcon = L.divIcon({
      className: "",
      html: `<div style="background:#4285F4;border:3px solid white;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 6px rgba(66,133,244,0.28);"></div>`,
      iconSize: [14,14], iconAnchor: [7,7]
    });
    L.marker([state.myLocation.lat, state.myLocation.lng], { icon: youIcon, zIndexOffset: 1000 })
      .addTo(leafletMapInstance)
      .bindPopup(`<div style="font-family:Inter,sans-serif;font-size:12px;">You are here</div>`);
  }

  if (withCoords.length && !mapEverFit && !state.focusDealId && !state.focusUserLocation) {
    leafletMapInstance.fitBounds(withCoords.map(d => [d.lat, d.lng]), { padding: [40,40], maxZoom: 15 });
    mapEverFit = true;
  }

  if (state.focusDealId) {
    const target = withCoords.find(d => d.id === state.focusDealId);
    if (target) {
      leafletMapInstance.setView([target.lat, target.lng], 16);
      markersById[target.id]?.openPopup();
    }
    state.focusDealId = null;
  }

  if (state.focusUserLocation && state.myLocation) {
    leafletMapInstance.setView([state.myLocation.lat, state.myLocation.lng], 15);
    state.focusUserLocation = false;
  }
}

function renderDealsOrEmpty(list) {
  if (list.length === 0) {
    const hasAny = state.deals.length > 0;
    let msg = "No deals on the tab yet. Start it off.";
    if (hasAny && state.filter === "live") msg = "Nothing's pouring right now. Check All deals or a specific day.";
    else if (hasAny && state.filter === "open") msg = "Nothing marked open right now (or hours just aren't filled in yet for these spots).";
    else if (hasAny) msg = "No deals match this filter.";
    return `
      <div class="empty-state">
        <p class="display" style="font-size:20px;color:var(--gold-bright);margin-bottom:8px;">${hasAny ? "Quiet round." : "Empty tab."}</p>
        <p style="color:rgba(239,231,216,0.7);font-size:14px;margin-bottom:20px;">${msg}</p>
        ${!hasAny ? `
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
            <button class="btn-primary" id="empty-add-btn">+ Add the first deal</button>
          </div>` : ""}
      </div>`;
  }
  if (state.groupByNeighborhood) {
    const citiesInList = [...new Set(list.map(getCity).filter(Boolean))];
    if (citiesInList.length > 1) {
      const byCity = {};
      list.forEach(d => {
        const city = getCity(d) || "Other";
        (byCity[city] = byCity[city] || []).push(d);
      });
      const cityKeys = Object.keys(byCity).sort((a, b) => {
        if (a === "Other") return 1;
        if (b === "Other") return -1;
        return a.localeCompare(b, undefined, { sensitivity: "base" });
      });
      return cityKeys.map(city => `
        <div style="margin-bottom:30px;">
          <p class="display" style="color:var(--gold-bright);font-size:17px;font-weight:700;margin:0 0 12px 2px;border-bottom:1px solid rgba(201,162,39,0.25);padding-bottom:6px;">${esc(city)}</p>
          ${renderNeighborhoodGroups(byCity[city])}
        </div>
      `).join("");
    }
    return renderNeighborhoodGroups(list);
  }
  return `<div style="display:flex;flex-direction:column;gap:20px;">${list.map(dealCardHtml).join("")}</div>`;
}

function renderNeighborhoodGroups(list) {
  const groups = {};
  list.forEach(d => {
    const key = (d.neighborhood || "").trim() || "Other";
    (groups[key] = groups[key] || []).push(d);
  });
  const keys = Object.keys(groups).sort((a, b) => {
    if (a === "Other") return 1;
    if (b === "Other") return -1;
    return a.localeCompare(b, undefined, { sensitivity: "base" });
  });
  return keys.map(key => `
    <div style="margin-bottom:24px;">
      <p class="mono" style="color:var(--gold-bright);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0 0 12px 2px;">${esc(key)}</p>
      <div style="display:flex;flex-direction:column;gap:20px;">${groups[key].map(dealCardHtml).join("")}</div>
    </div>
  `).join("");
}

function scheduleHtml(s, today, filterDay) {
  const drinks = s.drinks || [], food = s.food || [];
  const dayChips = dayRanges(s.days || []).map(r => {
    const label = r.start === r.end ? DAYS[r.start] : `${DAYS[r.start]}–${DAYS[r.end]}`;
    const includesToday = today >= r.start && today <= r.end;
    const includesFilter = filterDay >= 0 && filterDay >= r.start && filterDay <= r.end;
    return `<span class="day-tag ${includesToday?'today':''} ${includesFilter?'filter-selected':''}">${label}</span>`;
  }).join("");
  return `
    <div style="margin-top:10px;">
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        ${dayChips}
        <span class="mono" style="font-size:12px;align-self:center;margin-left:4px;opacity:.75;">${fmtTime(s.startTime)} – ${fmtTime(s.endTime)}</span>
      </div>
      ${(drinks.length || food.length) ? `
        <div style="display:grid;grid-template-columns:${drinks.length && food.length ? '1fr 1fr' : '1fr'};gap:16px;margin-top:8px;">
          ${drinks.length ? `<div><p class="field-label" style="margin-bottom:6px;">Drinks</p><ul class="mono" style="list-style:none;padding:0;margin:0;font-size:13px;line-height:1.7;">${drinks.map(l=>`<li>— ${esc(l)}</li>`).join("")}</ul></div>` : ""}
          ${food.length ? `<div><p class="field-label" style="margin-bottom:6px;">Food</p><ul class="mono" style="list-style:none;padding:0;margin:0;font-size:13px;line-height:1.7;">${food.map(l=>`<li>— ${esc(l)}</li>`).join("")}</ul></div>` : ""}
        </div>` : ""}
    </div>`;
}

function dealCardHtml(deal) {
  const active = isActiveNow(deal, state.now);
  const today = state.now.getDay();
  const filterDay = typeof state.filter === "number" ? state.filter : -1;
  const schedules = getSchedules(deal);
  const hasLinks = deal.website || deal.instagram || deal.facebook;
  const showDistance = state.sortMode === "near" && state.myLocation && typeof deal.lat === "number";
  const distance = showDistance ? distanceMiles(state.myLocation.lat, state.myLocation.lng, deal.lat, deal.lng) : null;
  const isFav = state.favorites.has(deal.id);
  const openNow = isOpenNow(deal);
  const dirUrl = directionsUrl(deal);
  return `
    <div class="ticket" id="deal-${deal.id}" style="padding:22px 20px 18px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
        <div>
          <div style="display:flex;align-items:center;gap:8px;">
            <h2 class="display" style="font-size:22px;font-weight:700;margin:0;">${esc(deal.venue)}</h2>
            <button class="fav-btn" data-fav="${deal.id}" title="${isFav ? "Remove favorite" : "Mark as favorite"}" aria-label="${isFav ? "Remove favorite" : "Mark as favorite"}">${isFav ? "★" : "☆"}</button>
          </div>
          ${deal.neighborhood ? `<p class="mono" style="font-size:12px;margin:3px 0 0;opacity:.65;">${esc(deal.neighborhood)}</p>` : ""}
          ${deal.address ? `<p class="mono" style="font-size:11px;margin:2px 0 0;opacity:.55;">${esc(deal.address)}</p>` : ""}
          ${distance !== null ? `<p class="mono" style="font-size:11px;margin:3px 0 0;opacity:.7;color:var(--green);font-weight:600;">📍 ${fmtDistance(distance)}</p>` : ""}
          ${summarizeHours(deal) ? `<p class="mono" style="font-size:11px;margin:4px 0 0;opacity:.6;">Open ${esc(summarizeHours(deal))}${openNow === true ? ' <span class="open-badge">OPEN NOW</span>' : openNow === false ? ' <span class="closed-badge">CLOSED NOW</span>' : ""}</p>` : ""}
          ${deal.cashOnly ? `<span class="cash-badge" style="margin-top:6px;">💵 CASH ONLY</span>` : ""}
        </div>
        ${active ? `<span class="pour-badge"><span class="pour-dot"></span>POURING NOW</span>` : ""}
      </div>
      <div class="tear-divider"></div>
      ${schedules.length ? `<p class="field-label" style="margin-bottom:4px;">Happy hour</p>` : ""}
      ${schedules.length ? schedules.map(s => scheduleHtml(s, today, filterDay)).join('<div class="tear-divider" style="opacity:.5;"></div>') : `<p class="mono" style="font-size:12px;opacity:.55;">No happy hour info yet — tap Edit to add it.</p>`}
      ${deal.notes ? `<p style="font-size:13px;font-style:italic;margin-top:12px;opacity:.8;">${esc(deal.notes)}</p>` : ""}
      ${(hasLinks || dirUrl) ? `
        <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;">
          ${dirUrl ? `<a class="link-pill" href="${dirUrl}" target="_blank" rel="noopener">Directions</a>` : ""}
          ${deal.website ? `<a class="link-pill" href="${esc(deal.website)}" target="_blank" rel="noopener">Website</a>` : ""}
          ${deal.instagram ? `<a class="link-pill" href="${esc(deal.instagram)}" target="_blank" rel="noopener">Instagram</a>` : ""}
          ${deal.facebook ? `<a class="link-pill" href="${esc(deal.facebook)}" target="_blank" rel="noopener">Facebook</a>` : ""}
        </div>` : ""}
      <div class="tear-divider"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <p class="mono" style="font-size:11px;opacity:.55;margin:0;">added by ${esc(deal.addedBy || "someone")}${deal.updatedAt ? ` · verified ${fmtRelativeTime(deal.updatedAt)}` : ""}</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="icon-btn" data-share="${deal.id}">Share</button>
          ${typeof deal.lat === "number"
            ? `<button class="icon-btn" data-viewmap="${deal.id}">View on map</button><button class="icon-btn" data-pickpin="${deal.id}">Move pin</button>`
            : `${deal.address ? `<button class="icon-btn" data-retrygeo="${deal.id}">📍 Auto-locate</button>` : ""}<button class="icon-btn" data-pickpin="${deal.id}">📌 Set pin manually</button>`}
          <button class="icon-btn" data-edit="${deal.id}">Edit</button>
          <button class="icon-btn danger" data-delete="${deal.id}">Delete</button>
        </div>
      </div>
    </div>`;
}

function neighborhoodOptionsHtml(city, selected) {
  const list = state.neighborhoodsByCity[(city || "").trim()] || [];
  const isKnown = selected && list.includes(selected);
  const opts = list.map(n => `<option value="${esc(n)}" ${n===selected?'selected':''}>${esc(n)}</option>`).join("");
  const customOpt = (selected && !isKnown) ? `<option value="${esc(selected)}" selected>${esc(selected)}</option>` : "";
  return `<option value="">— None / not sure —</option>${customOpt}${opts}<option value="__new__">+ Add a new neighborhood…</option>`;
}

        <div class="tear-divider"></div>
        <div style="display:flex;justify-content:flex-end;">
          <button type="button" class="btn-primary" id="manage-hoods-close">Done</button>
        </div>
      </div>
    </div>`;
}

function renderConfirm() {
  const deal = state.deals.find(d => d.id === state.confirmDeleteId);
  return `
    <div class="modal-overlay" id="confirm-overlay">
      <div class="ticket" style="max-width:380px;width:100%;padding:24px 22px;margin-top:80px;">
        <h3 class="display" style="font-size:19px;font-weight:700;margin:0 0 8px;">Remove this deal?</h3>
        <p style="font-size:14px;opacity:.8;margin:0 0 18px;">${deal ? `"${esc(deal.venue)}" will be removed from everyone's tab. This can't be undone.` : "This will be removed from everyone's tab. This can't be undone."}</p>
        <div style="display:flex;justify-content:flex-end;gap:10px;">
          <button class="btn-ghost" id="confirm-cancel">Cancel</button>
          <button class="btn-primary" style="background:var(--rust);color:var(--off-white);" id="confirm-remove">Remove</button>
        </div>
      </div>
    </div>`;
}

function renderNameField() {
  const el = document.getElementById("name-field");
  if (!el) return;
  el.innerHTML = state.myName
    ? `<button class="mono" id="name-btn" style="background:transparent;border:none;color:rgba(239,231,216,0.7);font-size:12px;text-decoration:underline;text-underline-offset:3px;">ordering as ${esc(state.myName)}</button>`
    : `<button class="mono" id="name-btn" style="background:transparent;border:none;color:rgba(239,231,216,0.7);font-size:12px;text-decoration:underline;text-underline-offset:3px;">set your name</button>`;
  el.querySelector("#name-btn").onclick = () => {
    el.innerHTML = `<span style="display:flex;gap:6px;align-items:center;">
      <input class="field-input" id="name-input" style="width:140px;background:rgba(255,255,255,0.9);" value="${esc(state.myName)}" />
      <button class="icon-btn" id="name-save">Save</button></span>`;
    const input = el.querySelector("#name-input");
    input.focus();
    const save = () => { saveName(input.value.trim()); render(); };
    el.querySelector("#name-save").onclick = save;
    input.onkeydown = (e) => { if (e.key === "Enter") save(); if (e.key === "Escape") render(); };
  };
}

function bindEvents() {
  document.querySelectorAll("[data-filter]").forEach(btn => {
    btn.onclick = () => {
      const v = btn.dataset.filter;
      state.filter = (v === "live" || v === "all" || v === "open") ? v : Number(v);
      render();
    };
  });
  document.querySelectorAll("[data-view]").forEach(btn => {
    btn.onclick = () => { state.view = btn.dataset.view; render(); };
  });
  const groupToggle = document.getElementById("group-toggle");
  if (groupToggle) groupToggle.onclick = () => { state.groupByNeighborhood = !state.groupByNeighborhood; render(); };
  const surpriseBtn = document.getElementById("surprise-btn");
  if (surpriseBtn) surpriseBtn.onclick = () => surpriseMe();

  const searchInput = document.getElementById("search-input");
  if (searchInput) searchInput.oninput = (e) => { state.search = e.target.value; render(); };
  const cityFilterEl = document.getElementById("city-filter");
  if (cityFilterEl) cityFilterEl.onchange = (e) => {
    state.cityFilter = e.target.value;
    mapEverFit = false; // let the map re-fit to whichever city is now showing
    render();
  };
  document.querySelectorAll("[data-sort]").forEach(btn => {
    btn.onclick = () => setSortMode(btn.dataset.sort);
  });
  const locateBtn = document.getElementById("locate-btn");
  if (locateBtn) locateBtn.onclick = () => locateOnMap();
  const homeBtn = document.getElementById("home-btn");
  if (homeBtn) homeBtn.onclick = () => goHome();

  const addBtn = document.getElementById("add-btn");
  if (addBtn) addBtn.onclick = () => { state.editingDeal = null; state.showForm = true; render(); };
  const emptyAddBtn = document.getElementById("empty-add-btn");
  if (emptyAddBtn) emptyAddBtn.onclick = () => { state.editingDeal = null; state.showForm = true; render(); };
  const aboutLink = document.getElementById("about-link");
  if (aboutLink) aboutLink.onclick = () => { state.showAbout = true; render(); };
  const manageHoodsLink = document.getElementById("manage-hoods-link");
  if (manageHoodsLink) manageHoodsLink.onclick = () => {
    const known = Object.keys(state.neighborhoodsByCity);
    state.manageCity = (state.cityFilter !== "all" && known.includes(state.cityFilter)) ? state.cityFilter : (known[0] || "Savannah, GA");
    state.showManageNeighborhoods = true;
    render();
  };

  const manageOverlay = document.getElementById("manage-hoods-overlay");
  if (manageOverlay) {
    manageOverlay.onclick = (e) => { if (e.target === manageOverlay) { state.showManageNeighborhoods = false; render(); } };
    document.getElementById("manage-hoods-close").onclick = () => { state.showManageNeighborhoods = false; render(); };
    const manageCitySelect = document.getElementById("manage-city-select");
    if (manageCitySelect) manageCitySelect.onchange = (e) => { state.manageCity = e.target.value; render(); };
    document.querySelectorAll("[data-remove-hood]").forEach(btn => {
      btn.onclick = async () => { await removeNeighborhood(state.manageCity, btn.dataset.removeHood); };
    });
    const addHoodBtn = document.getElementById("add-hood-btn");
    const newHoodInput = document.getElementById("new-hood-input");
    if (addHoodBtn && newHoodInput) {
      const submitNewHood = async () => {
        const name = newHoodInput.value.trim();
        if (!name) return;
        addHoodBtn.disabled = true;
        await addNeighborhood(state.manageCity, name);
        addHoodBtn.disabled = false;
      };
      addHoodBtn.onclick = submitNewHood;
      newHoodInput.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); submitNewHood(); } };
    }
  }

  document.querySelectorAll("[data-edit]").forEach(btn => {
    btn.onclick = () => {
      state.editingDeal = state.deals.find(d => d.id === btn.dataset.edit) || null;
      state.showForm = true; render();
    };
  });
  document.querySelectorAll("[data-delete]").forEach(btn => {
    btn.onclick = () => { state.confirmDeleteId = btn.dataset.delete; render(); };
  });
  document.querySelectorAll("[data-viewmap]").forEach(btn => {
    btn.onclick = () => goToMap(btn.dataset.viewmap);
  });
  document.querySelectorAll("[data-retrygeo]").forEach(btn => {
    btn.onclick = () => retryGeocode(btn.dataset.retrygeo);
  });
  document.querySelectorAll("[data-pickpin]").forEach(btn => {
    btn.onclick = () => startPickLocation(btn.dataset.pickpin);
  });
  const cancelPickBtn = document.getElementById("cancel-pick-btn");
  if (cancelPickBtn) cancelPickBtn.onclick = () => { state.pickingLocationFor = null; render(); };
  document.querySelectorAll("[data-fav]").forEach(btn => {
    btn.onclick = () => toggleFavorite(btn.dataset.fav);
  });
  document.querySelectorAll("[data-share]").forEach(btn => {
    btn.onclick = () => shareDeal(btn.dataset.share);
  });

  const formOverlay = document.getElementById("form-overlay");
  if (formOverlay) {
    formOverlay.onclick = (e) => { if (e.target === formOverlay) { state.showForm = false; state.editingDeal = null; render(); } };
    document.getElementById("form-cancel").onclick = () => { state.showForm = false; state.editingDeal = null; render(); };

    const form = document.getElementById("deal-form");

    const venueInput = document.getElementById("venue-input");
    if (venueInput) {
      venueInput.oninput = () => {
        const dup = findDuplicateVenue(venueInput.value, state.editingDeal?.id);
        const warn = document.getElementById("dup-warning");
        if (warn) {
          if (dup) {
            warn.textContent = `"${dup.venue}" is already on the tab — check if this is a duplicate before adding another.`;
            warn.style.display = "block";
          } else {
            warn.style.display = "none";
          }
        }
      };
    }

    const cityInput = document.getElementById("city-input");
    const neighborhoodSelect = document.getElementById("neighborhood-select");
    const neighborhoodNew = document.getElementById("neighborhood-new");
    if (cityInput && neighborhoodSelect) {
      cityInput.addEventListener("input", () => {
        const cur = neighborhoodSelect.value === "__new__" ? "" : neighborhoodSelect.value;
        neighborhoodSelect.innerHTML = neighborhoodOptionsHtml(cityInput.value.trim(), cur);
      });
    }
    if (neighborhoodSelect && neighborhoodNew) {
      neighborhoodSelect.addEventListener("change", () => {
        if (neighborhoodSelect.value === "__new__") {
          neighborhoodNew.style.display = "block";
          neighborhoodNew.focus();
        } else {
          neighborhoodNew.style.display = "none";
        }
      });
    }

    form.addEventListener("click", (e) => {
      if (e.target.matches("[data-day]")) {
        const block = e.target.closest(".schedule-block");
        const hidden = block.querySelector(".sched-days");
        let days = hidden.value ? hidden.value.split(",").map(Number) : [];
        const i = Number(e.target.dataset.day);
        days = days.includes(i) ? days.filter(x=>x!==i) : [...days, i].sort((a,b)=>a-b);
        hidden.value = days.join(",");
        e.target.classList.toggle("selected");
      }
      if (e.target.classList.contains("remove-schedule")) {
        e.target.closest(".schedule-block").remove();
      }
      if (e.target.matches("[data-hday]")) {
        const block = e.target.closest(".hours-block");
        const hidden = block.querySelector(".hours-days");
        let days = hidden.value ? hidden.value.split(",").map(Number) : [];
        const i = Number(e.target.dataset.hday);
        days = days.includes(i) ? days.filter(x=>x!==i) : [...days, i].sort((a,b)=>a-b);
        hidden.value = days.join(",");
        e.target.classList.toggle("selected");
      }
      if (e.target.classList.contains("remove-hours-block")) {
        e.target.closest(".hours-block").remove();
      }
    });

    document.getElementById("add-schedule-btn").onclick = () => {
      scheduleBlockCounter += 1;
      document.getElementById("schedules-container").insertAdjacentHTML("beforeend", scheduleBlockHtml(null, "new" + scheduleBlockCounter));
    };
    document.getElementById("add-hours-btn").onclick = () => {
      scheduleBlockCounter += 1;
      document.getElementById("hours-container").insertAdjacentHTML("beforeend", hoursBlockHtml(null, "new" + scheduleBlockCounter));
    };

    form.onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target;
      const venue = f.venue.value.trim();
      const addedBy = f.addedBy.value.trim();
      const errEl = document.getElementById("form-error");

      const scheduleBlocks = form.querySelectorAll(".schedule-block");
      const schedules = [];
      scheduleBlocks.forEach(block => {
        const daysVal = block.querySelector(".sched-days").value;
        const days = daysVal ? daysVal.split(",").map(Number) : [];
        if (!days.length) return;
        schedules.push({
          days,
          startTime: block.querySelector(".sched-start").value,
          endTime: block.querySelector(".sched-end").value,
          drinks: linesToList(block.querySelector(".sched-drinks").value),
          food: linesToList(block.querySelector(".sched-food").value),
        });
      });

      const hoursBlockEls = form.querySelectorAll(".hours-block");
      const hoursBlocks = [];
      hoursBlockEls.forEach(block => {
        const daysVal = block.querySelector(".hours-days").value;
        const days = daysVal ? daysVal.split(",").map(Number) : [];
        if (!days.length) return;
        hoursBlocks.push({
          days,
          startTime: block.querySelector(".hours-start").value,
          endTime: block.querySelector(".hours-end").value,
        });
      });

      if (!venue || !addedBy) {
        errEl.textContent = "Venue name and your name are required.";
        errEl.style.display = "block";
        return;
      }

      const submitBtn = f.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      const address = f.address.value.trim();
      const city = f.city.value.trim();
      let neighborhood = f.querySelector("#neighborhood-select")?.value || "";
      if (neighborhood === "__new__") {
        neighborhood = f.querySelector("#neighborhood-new")?.value.trim() || "";
      }
      submitBtn.textContent = address ? "Finding it on the map…" : "Saving…";
      let coords = null;
      if (address) coords = await geocodeAddress(address);
      if (addedBy !== state.myName) saveName(addedBy);
      if (city) localStorage.setItem("tab-last-city", city);
      if (neighborhood && city) addNeighborhood(city, neighborhood); // fire-and-forget

      const data = {
        venue, neighborhood, address, city,
        hoursBlocks,
        schedules,
        notes: f.notes.value.trim(), addedBy,
        cashOnly: f.cashOnly.checked,
        website: normalizeUrl(f.website.value),
        instagram: normalizeUrl(f.instagram.value),
        facebook: normalizeUrl(f.facebook.value),
      };
      if (coords) {
        data.lat = coords.lat; data.lng = coords.lng;
      } else if (address && state.editingDeal) {
        // Address was changed/re-checked but couldn't be geocoded — clear any old pin
        // rather than silently leaving it pointing at the previous address.
        data.lat = firebase.firestore.FieldValue.delete();
        data.lng = firebase.firestore.FieldValue.delete();
      }
      submitBtn.textContent = "Saving…";
      if (address && !coords) {
        state.error = state.editingDeal
          ? `Saved, but couldn't re-locate "${address}" on the map — its old pin was removed since it may not match anymore. Try "Place on map" on the card, or double-check the address.`
          : `Saved, but couldn't find "${address}" on a map — it won't show a pin yet. Try the "Place on map" button on its card, or double-check the address.`;
      } else if (coords && state.editingDeal) {
        state.focusDealId = state.editingDeal.id; // so the map centers on the corrected spot next time you check it
      }
      if (state.editingDeal) await updateDeal(state.editingDeal.id, data);
      else await addDeal(data);
    };
  }

  const confirmOverlay = document.getElementById("confirm-overlay");
  if (confirmOverlay) {
    confirmOverlay.onclick = (e) => { if (e.target === confirmOverlay) { state.confirmDeleteId = null; render(); } };
    document.getElementById("confirm-cancel").onclick = () => { state.confirmDeleteId = null; render(); };
    document.getElementById("confirm-remove").onclick = () => deleteDeal(state.confirmDeleteId);
  }

  const aboutOverlay = document.getElementById("about-overlay");
  if (aboutOverlay) {
    aboutOverlay.onclick = (e) => { if (e.target === aboutOverlay) { state.showAbout = false; render(); } };
    document.getElementById("about-close").onclick = () => { state.showAbout = false; render(); };
  }
}

render();
</script>
</body>
</html>
